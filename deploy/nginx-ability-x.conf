# nginx: the AbilityX Node app, behind Cloudflare.
#
# Install as /etc/nginx/conf.d/ability-x.conf. It is a file of our own:
# Virtualmin manages its own vhost for ability-x.org under sites-enabled/ and
# rewrites it, so never edit that one. conf.d/ is included first, so this
# block wins a duplicate server_name ("conflicting server name ... ignored"
# warnings for Virtualmin's block are expected).
#
# Before installing, replace:
#   SERVER_IP  the address every Virtualmin vhost listens on (see `grep -h listen /etc/nginx/sites-enabled/*`)
#   4321       if PORT in /etc/ability-x.env is different
# Test before reloading:  sudo nginx -t && sudo systemctl reload nginx

# Only Cloudflare may reach the origin. Decided on the CONNECTING address
# ($realip_remote_addr): the realip settings below swap $remote_addr for the
# visitor's IP, so allow/deny on $remote_addr would refuse everyone.
# Ranges from https://www.cloudflare.com/ips/ (deploy/cloudflare-ips.txt).
geo $realip_remote_addr $abilityx_from_cloudflare {
    default 0;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    108.162.192.0/18 1;
    131.0.72.0/22 1;
    141.101.64.0/18 1;
    162.158.0.0/15 1;
    172.64.0.0/13 1;
    173.245.48.0/20 1;
    188.114.96.0/20 1;
    190.93.240.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    # Both ports, so any zone SSL mode works (Flexible uses 80, Full uses 443).
    listen SERVER_IP:80;
    listen SERVER_IP:443 ssl;
    # www is redirected to the apex by a Cloudflare Redirect Rule.
    server_name ability-x.org www.ability-x.org;

    # Cloudflare Origin Certificate for ability-x.org and *.ability-x.org.
    ssl_certificate     /etc/ssl/ability-x/origin.pem;
    ssl_certificate_key /etc/ssl/ability-x/origin.key;

    # The visitor's IP, for the logs and the app.
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    if ($abilityx_from_cloudflare = 0) {
        return 403;
    }

    # Media uploads from the admin.
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        # The site builds its own URLs from the Host header.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Trustworthy only because of the Cloudflare-only check above
        # (trustedProxyHeaders in astro.config.mjs).
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
