<!-- @dsCard group="Colors" viewport="700x180" name="Brand Colors" subtitle="Primary red, black, white + red scale" -->
<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Brand Colors" subtitle="Primary red, black, white + red scale" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: #fff; padding: 20px; }
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
  .row { display: flex; gap: 10px; align-items: stretch; }
  .swatch-lg { flex: 1; height: 80px; border-radius: 8px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
  .swatch-sm { flex: 1; height: 48px; border-radius: 6px; }
  .swatch-label { font-size: 11px; font-weight: 600; margin-top: 8px; color: #1f1f1f; letter-spacing: 0.03em; }
  .swatch-hex { font-size: 10px; color: #6b6b6b; font-family: monospace; }
  .col { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .section-title { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #8f8f8f; margin-bottom: 8px; }
  .inner-label { font-size: 9px; font-weight: 600; color: rgba(255,255,255,0.85); letter-spacing: 0.04em; }
  .inner-hex { font-size: 8px; color: rgba(255,255,255,0.65); font-family: monospace; }
  .dark-label { color: rgba(0,0,0,0.6); }
  .dark-hex { color: rgba(0,0,0,0.4); }
  .gap { gap: 6px; }
</style>
</head>
<body>
  <div class="section-title">Brand Colors</div>
  <div class="row" style="margin-bottom:12px;">
    <div class="col">
      <div class="swatch-lg" style="background:#CC0000;">
        <div class="inner-label">Red 600 — Primary</div>
        <div class="inner-hex">#CC0000</div>
      </div>
      <div class="swatch-label">Brand Red</div>
    </div>
    <div class="col">
      <div class="swatch-lg" style="background:#0D0D0D;">
        <div class="inner-label">Black</div>
        <div class="inner-hex">#0D0D0D</div>
      </div>
      <div class="swatch-label">Brand Black</div>
    </div>
    <div class="col">
      <div class="swatch-lg" style="background:#FFFFFF; border:1px solid #e8e8e8;">
        <div class="inner-label dark-label">White</div>
        <div class="inner-hex dark-hex">#FFFFFF</div>
      </div>
      <div class="swatch-label">Brand White</div>
    </div>
  </div>
  <div class="section-title">Red Scale</div>
  <div class="row gap">
    <div style="flex:1;height:32px;border-radius:4px;background:#7a0000;"></div>
    <div style="flex:1;height:32px;border-radius:4px;background:#990000;"></div>
    <div style="flex:1;height:32px;border-radius:4px;background:#b30000;"></div>
    <div style="flex:1;height:32px;border-radius:4px;background:#CC0000;outline:2px solid #0d0d0d;outline-offset:2px;"></div>
    <div style="flex:1;height:32px;border-radius:4px;background:#e00000;"></div>
    <div style="flex:1;height:32px;border-radius:4px;background:#f03030;"></div>
    <div style="flex:1;height:32px;border-radius:4px;background:#f87070;"></div>
    <div style="flex:1;height:32px;border-radius:4px;background:#fbb0b0;"></div>
    <div style="flex:1;height:32px;border-radius:4px;background:#fde8e8;"></div>
    <div style="flex:1;height:32px;border-radius:4px;background:#fff5f5;border:1px solid #e8e8e8;"></div>
  </div>
  <div class="row" style="margin-top:2px; gap:6px;">
    <div style="flex:1;text-align:center;font-size:8px;color:#8f8f8f;">900</div>
    <div style="flex:1;text-align:center;font-size:8px;color:#8f8f8f;">800</div>
    <div style="flex:1;text-align:center;font-size:8px;color:#8f8f8f;">700</div>
    <div style="flex:1;text-align:center;font-size:8px;font-weight:700;color:#0d0d0d;">600</div>
    <div style="flex:1;text-align:center;font-size:8px;color:#8f8f8f;">500</div>
    <div style="flex:1;text-align:center;font-size:8px;color:#8f8f8f;">400</div>
    <div style="flex:1;text-align:center;font-size:8px;color:#8f8f8f;">300</div>
    <div style="flex:1;text-align:center;font-size:8px;color:#8f8f8f;">200</div>
    <div style="flex:1;text-align:center;font-size:8px;color:#8f8f8f;">100</div>
    <div style="flex:1;text-align:center;font-size:8px;color:#8f8f8f;">50</div>
  </div>
</body>
</html>
