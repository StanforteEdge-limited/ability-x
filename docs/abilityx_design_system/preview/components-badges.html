<!DOCTYPE html>
<!-- @dsCard group="Components" name="Badges & Tags" subtitle="Badge variants + category tag labels" viewport="700x140" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f5f5f5; padding: 20px; font-family: 'DM Sans', system-ui, sans-serif; }
  .section-title { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #8f8f8f; margin-bottom: 12px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; align-items: flex-start; }
  .divider { height: 1px; background: #e8e8e8; margin-bottom: 14px; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge-red { background: #fde8e8; color: #CC0000; }
  .badge-black { background: #0d0d0d; color: #fff; }
  .badge-gray { background: #e8e8e8; color: #404040; }
  .badge-outline { background: transparent; color: #CC0000; border: 1.5px solid #CC0000; }
  .badge-white { background: #fff; color: #0d0d0d; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

  /* Tags */
  .tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .tag-red   { background: #CC0000; color: #fff; }
  .tag-black { background: #0d0d0d; color: #fff; }
  .tag-light { background: #f5f5f5; color: #6b6b6b; }
  .tag-red-light { background: #fde8e8; color: #CC0000; }
</style>
</head>
<body>
  <div class="section-title">Badges</div>
  <div class="row">
    <span class="badge badge-red">Disability Inclusion</span>
    <span class="badge badge-black">Nigeria 2025</span>
    <span class="badge badge-gray">Technology</span>
    <span class="badge badge-outline">Featured</span>
    <span class="badge badge-white">Policy</span>
  </div>
  <div class="divider"></div>
  <div class="section-title">Tags / Category Labels</div>
  <div class="row">
    <span class="tag tag-red">Movement</span>
    <span class="tag tag-black">Keynote</span>
    <span class="tag tag-light">Workshop</span>
    <span class="tag tag-red-light">Accessibility</span>
    <span class="tag tag-light">Panel</span>
    <span class="tag tag-red">Sold Out</span>
  </div>
</body>
</html>
