<!DOCTYPE html>
<!-- @dsCard group="Components" name="Buttons" subtitle="Primary, secondary, ghost, black, disabled + sizes" viewport="700x160" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; padding: 24px; font-family: 'DM Sans', system-ui, sans-serif; }
  .section-title { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #8f8f8f; margin-bottom: 14px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .divider { height: 1px; background: #f5f5f5; margin-bottom: 16px; }

  /* Button styles */
  .btn { display: inline-flex; align-items: center; gap: 6px; font-family: 'DM Sans', sans-serif; font-weight: 600; cursor: pointer; border: none; transition: all 150ms ease-in-out; }
  .btn-primary { background: #CC0000; color: #fff; padding: 12px 28px; border-radius: 999px; font-size: 14px; }
  .btn-primary:hover { background: #b30000; }
  .btn-secondary { background: transparent; color: #CC0000; padding: 11px 27px; border-radius: 999px; font-size: 14px; border: 1.5px solid #CC0000; }
  .btn-ghost { background: transparent; color: #0d0d0d; padding: 11px 27px; border-radius: 999px; font-size: 14px; border: 1.5px solid #d4d4d4; }
  .btn-black { background: #0d0d0d; color: #fff; padding: 12px 28px; border-radius: 999px; font-size: 14px; }
  .btn-sm { padding: 8px 18px; font-size: 12px; border-radius: 999px; }
  .btn-lg { padding: 16px 36px; font-size: 16px; border-radius: 999px; }
  .btn-disabled { background: #e8e8e8; color: #b5b5b5; padding: 12px 28px; border-radius: 999px; font-size: 14px; cursor: not-allowed; }
  .btn-text { background: none; color: #CC0000; font-size: 14px; font-weight: 600; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

  .label { font-size: 9px; font-weight: 600; color: #8f8f8f; letter-spacing: 0.08em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="section-title">Buttons</div>
  <div class="row">
    <button class="btn btn-primary">Register Now</button>
    <button class="btn btn-secondary">Learn More</button>
    <button class="btn btn-ghost">View Schedule</button>
    <button class="btn btn-black">Get Tickets</button>
    <button class="btn btn-disabled" disabled>Sold Out</button>
    <button class="btn btn-text">See all sessions →</button>
  </div>
  <div class="divider"></div>
  <div class="section-title">Sizes</div>
  <div class="row">
    <button class="btn btn-primary btn-sm">Small</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-lg">Large</button>
  </div>
</body>
</html>
