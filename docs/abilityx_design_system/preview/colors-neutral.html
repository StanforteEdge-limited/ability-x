<!-- @dsCard group="Colors" viewport="700x120" name="Neutral Palette" subtitle="12-step gray scale from black to white" -->
<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Neutral Palette" subtitle="12-step gray scale from black to white" viewport="700x120" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', system-ui, sans-serif; background: #fff; padding: 20px; }
  .section-title { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #8f8f8f; margin-bottom: 10px; }
  .row { display: flex; gap: 6px; }
  .col { display: flex; flex-direction: column; gap: 4px; align-items: center; flex: 1; }
  .chip { width: 100%; height: 40px; border-radius: 6px; }
  .name { font-size: 8px; font-weight: 600; color: #555; text-align: center; line-height: 1.2; }
  .hex  { font-size: 8px; color: #8f8f8f; font-family: monospace; text-align: center; }
</style>
</head>
<body>
  <div class="section-title">Neutral Palette</div>
  <div class="row">
    <div class="col">
      <div class="chip" style="background:#0d0d0d;"></div>
      <div class="name">Black</div>
      <div class="hex">#0D0D0D</div>
    </div>
    <div class="col">
      <div class="chip" style="background:#1f1f1f;"></div>
      <div class="name">Gray 900</div>
      <div class="hex">#1F1F1F</div>
    </div>
    <div class="col">
      <div class="chip" style="background:#2e2e2e;"></div>
      <div class="name">Gray 800</div>
      <div class="hex">#2E2E2E</div>
    </div>
    <div class="col">
      <div class="chip" style="background:#404040;"></div>
      <div class="name">Gray 700</div>
      <div class="hex">#404040</div>
    </div>
    <div class="col">
      <div class="chip" style="background:#555555;"></div>
      <div class="name">Gray 600</div>
      <div class="hex">#555555</div>
    </div>
    <div class="col">
      <div class="chip" style="background:#6b6b6b;"></div>
      <div class="name">Gray 500</div>
      <div class="hex">#6B6B6B</div>
    </div>
    <div class="col">
      <div class="chip" style="background:#8f8f8f;"></div>
      <div class="name">Gray 400</div>
      <div class="hex">#8F8F8F</div>
    </div>
    <div class="col">
      <div class="chip" style="background:#b5b5b5;"></div>
      <div class="name">Gray 300</div>
      <div class="hex">#B5B5B5</div>
    </div>
    <div class="col">
      <div class="chip" style="background:#d4d4d4;"></div>
      <div class="name">Gray 200</div>
      <div class="hex">#D4D4D4</div>
    </div>
    <div class="col">
      <div class="chip" style="background:#e8e8e8;"></div>
      <div class="name">Gray 100</div>
      <div class="hex">#E8E8E8</div>
    </div>
    <div class="col">
      <div class="chip" style="background:#f5f5f5; border:1px solid #e8e8e8;"></div>
      <div class="name">Gray 50</div>
      <div class="hex">#F5F5F5</div>
    </div>
    <div class="col">
      <div class="chip" style="background:#fff; border:1px solid #e8e8e8;"></div>
      <div class="name">White</div>
      <div class="hex">#FFFFFF</div>
    </div>
  </div>
</body>
</html>
