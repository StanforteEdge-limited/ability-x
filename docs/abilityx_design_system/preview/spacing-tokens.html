<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing Scale" subtitle="4px base grid + border radius tokens" -->
<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing Scale" subtitle="4px base grid + border radius tokens" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; padding: 20px; font-family: 'DM Sans', system-ui, sans-serif; }
  .section-title { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #8f8f8f; margin-bottom: 12px; }
  .row { display: flex; align-items: flex-end; gap: 8px; margin-bottom: 16px; }
  .token { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .bar { background: #CC0000; border-radius: 2px; width: 28px; }
  .name { font-size: 8px; font-weight: 600; color: #1f1f1f; }
  .val  { font-size: 7px; color: #8f8f8f; font-family: monospace; }
  .divider { height: 1px; background: #f5f5f5; margin: 4px 0 14px; }
</style>
</head>
<body>
  <div class="section-title">Spacing Scale — 4px base grid</div>
  <div class="row">
    <div class="token"><div class="bar" style="height:4px;"></div><div class="name">sp-1</div><div class="val">4px</div></div>
    <div class="token"><div class="bar" style="height:8px;"></div><div class="name">sp-2</div><div class="val">8px</div></div>
    <div class="token"><div class="bar" style="height:12px;"></div><div class="name">sp-3</div><div class="val">12px</div></div>
    <div class="token"><div class="bar" style="height:16px;"></div><div class="name">sp-4</div><div class="val">16px</div></div>
    <div class="token"><div class="bar" style="height:20px;"></div><div class="name">sp-5</div><div class="val">20px</div></div>
    <div class="token"><div class="bar" style="height:24px;"></div><div class="name">sp-6</div><div class="val">24px</div></div>
    <div class="token"><div class="bar" style="height:32px;"></div><div class="name">sp-8</div><div class="val">32px</div></div>
    <div class="token"><div class="bar" style="height:40px;"></div><div class="name">sp-10</div><div class="val">40px</div></div>
    <div class="token"><div class="bar" style="height:48px;"></div><div class="name">sp-12</div><div class="val">48px</div></div>
    <div class="token"><div class="bar" style="height:64px;"></div><div class="name">sp-16</div><div class="val">64px</div></div>
    <div class="token"><div class="bar" style="height:80px;"></div><div class="name">sp-20</div><div class="val">80px</div></div>
  </div>
  <div class="divider"></div>
  <div class="section-title">Border Radius</div>
  <div class="row" style="align-items:center;">
    <div class="token">
      <div style="width:40px;height:40px;background:#0d0d0d;border-radius:4px;"></div>
      <div class="name">sm</div><div class="val">4px</div>
    </div>
    <div class="token">
      <div style="width:40px;height:40px;background:#0d0d0d;border-radius:8px;"></div>
      <div class="name">md</div><div class="val">8px</div>
    </div>
    <div class="token">
      <div style="width:40px;height:40px;background:#0d0d0d;border-radius:16px;"></div>
      <div class="name">lg</div><div class="val">16px</div>
    </div>
    <div class="token">
      <div style="width:40px;height:40px;background:#0d0d0d;border-radius:24px;"></div>
      <div class="name">xl</div><div class="val">24px</div>
    </div>
    <div class="token">
      <div style="width:80px;height:36px;background:#CC0000;border-radius:999px;"></div>
      <div class="name">pill</div><div class="val">999px</div>
    </div>
  </div>
</body>
</html>
